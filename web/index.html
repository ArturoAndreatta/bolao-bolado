<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Sem esta linha o navegador móvel assume um viewport virtual de ~980px e
    encolhe a página inteira para caber na tela — o app renderiza no layout
    de desktop e depois é reduzido, o que borra o texto e quebra os
    breakpoints de core/responsive.dart (que passariam a ler 980 em vez da
    largura real do aparelho).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Organize e participe de bolões com seus amigos de forma simples e divertida.">

  <!--
    Abre DNS + TLS com os hosts do Firebase já durante o download do
    main.dart.js, em vez de só quando a primeira leitura do Firestore
    acontece. Em redes com latência alta (ou resolução de DNS lenta), esse
    handshake sozinho custava quase um segundo antes da primeira query sair.
    crossorigin é obrigatório: sem ele o navegador abre uma conexão anônima
    separada e o preconnect é desperdiçado.
  -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <!-- O CanvasKit baixa fontes de fallback sob demanda (Noto Color Emoji
       para os emojis de avatar) direto do fonts.gstatic.com. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bolão Bolado">
  <link rel="apple-touch-icon" href="assets/images/icone.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/icone.png" />

  <!--
    Prévia do link (Discord, WhatsApp, Telegram, X). Sem estas tags o Discord
    monta o cartão só com <title> + description e não mostra imagem nenhuma:
    ele lê o HTML servido pelo Hosting e NÃO executa JavaScript, então nada do
    que o Flutter pinta depois entra na prévia — o cartão precisa estar pronto
    aqui no index.html.

    As URLs de imagem têm que ser ABSOLUTAS: o robô do Discord não resolve
    caminho relativo. `banner.jpg` fica em web/ (copiado tal e qual para
    build/web), 1200x630, o tamanho que o `summary_large_image` espera — é o
    que faz o embed virar banner largo em vez de miniatura no canto.

    O `?v=1` existe para furar cache: Discord e WhatsApp guardam a prévia por
    URL durante horas. Ao trocar a arte, suba o número, senão o cartão antigo
    continua aparecendo.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bolão Bolado">
  <meta property="og:title" content="Bolão Bolado">
  <meta property="og:description" content="Organize e participe de bolões com seus amigos de forma simples e divertida.">
  <meta property="og:url" content="https://bolaobolado-app.web.app/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://bolaobolado-app.web.app/banner.jpg?v=1">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo do Bolão Bolado sobre fundo escuro">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bolão Bolado">
  <meta name="twitter:description" content="Organize e participe de bolões com seus amigos de forma simples e divertida.">
  <meta name="twitter:image" content="https://bolaobolado-app.web.app/banner.jpg?v=1">

  <!--
    O Discord pinta a listra lateral do cartão com esta cor. Vale também para
    a barra do navegador no mobile, por isso é o dourado do CTA do tema
    escuro, e não uma cor solta.
  -->
  <meta name="theme-color" content="#E8B93A">

  <title>Bolão Bolado</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
