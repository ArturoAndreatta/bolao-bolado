<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redefinir senha — Bolão Bolado</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  :root {
    --card: #FEFEFE;
    --card-externo: #F3F1EF;
    --campo: #F3F4F6;
    --texto: #1F2937;
    --texto-suave: #6B7280;
    --texto-fraco: #9CA3AF;
    --azul: #487DE5;
    --texto-sobre-acao: #FEFEFE;
    --borda: #E5E7EB;
    --erro: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--card-externo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background-color: var(--card);
    border-radius: 16px;
    border: 1px solid var(--borda);
    overflow: hidden;
  }
  .topo {
    background: linear-gradient(135deg, #FFE082, #7CC8B5);
    padding: 28px 24px;
    text-align: center;
  }
  .topo img {
    width: 120px;
    display: block;
    margin: 0 auto;
    border-radius: 8px;
  }
  .conteudo {
    padding: 32px;
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 20px;
    font-weight: bold;
    color: var(--texto);
  }
  .subtitulo {
    margin: 0 0 24px 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--texto-suave);
  }
  .subtitulo strong {
    color: var(--texto);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--borda);
    background-color: var(--campo);
    color: var(--texto);
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input[type="password"]:focus {
    border-color: var(--azul);
  }
  .erro-campo {
    margin: -10px 0 14px 0;
    font-size: 13px;
    color: var(--erro);
    display: none;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background-color: var(--azul);
    color: var(--texto-sobre-acao);
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .estado {
    text-align: center;
    padding: 8px 0 4px 0;
  }
  .estado p {
    font-size: 14px;
    line-height: 1.6;
    color: var(--texto-suave);
    margin: 0;
  }
  .icone {
    font-size: 40px;
    margin-bottom: 12px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="topo">
      <img src="https://bolaobolado-app.web.app/assets/images/logo4.png" alt="Bolão Bolado" />
    </div>
    <div class="conteudo">

      <div id="carregando" class="estado">
        <p>Verificando o link…</p>
      </div>

      <div id="formulario" hidden>
        <h1>Nova senha</h1>
        <p class="subtitulo">Definindo uma nova senha para <strong id="emailUsuario"></strong>.</p>
        <form id="formSenha">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" autocomplete="new-password" minlength="8" required />
          <label for="confirmarSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarSenha" autocomplete="new-password" minlength="8" required />
          <p class="erro-campo" id="erroFormulario"></p>
          <button type="submit" id="botaoSalvar">Salvar nova senha</button>
        </form>
      </div>

      <div id="sucesso" class="estado" hidden>
        <div class="icone">✅</div>
        <p><strong style="color:var(--texto)">Senha redefinida!</strong><br />Já pode voltar pro app do Bolão Bolado e entrar com a nova senha.</p>
      </div>

      <div id="erroGeral" class="estado" hidden>
        <div class="icone">⚠️</div>
        <p id="mensagemErroGeral">Esse link não é mais válido. Pode ter expirado ou já ter sido usado — peça um novo link de redefinição no app.</p>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset,
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEGnjcQk2rmNIr8M6YO6hOJA0cYSujgZs",
      authDomain: "bolaobolado-app.firebaseapp.com",
      projectId: "bolaobolado-app",
      storageBucket: "bolaobolado-app.firebasestorage.app",
      messagingSenderId: "854630072700",
      appId: "1:854630072700:web:4ef9811226fe1ed78f64f9",
      measurementId: "G-8FXB1YJZXM",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const elCarregando = document.getElementById("carregando");
    const elFormularioBloco = document.getElementById("formulario");
    const elSucesso = document.getElementById("sucesso");
    const elErroGeral = document.getElementById("erroGeral");
    const elMensagemErroGeral = document.getElementById("mensagemErroGeral");
    const elEmailUsuario = document.getElementById("emailUsuario");
    const elForm = document.getElementById("formSenha");
    const elSenha = document.getElementById("senha");
    const elConfirmarSenha = document.getElementById("confirmarSenha");
    const elErroFormulario = document.getElementById("erroFormulario");
    const elBotaoSalvar = document.getElementById("botaoSalvar");

    function mostrarApenas(el) {
      [elCarregando, elFormularioBloco, elSucesso, elErroGeral].forEach((e) => {
        e.hidden = e !== el;
      });
    }

    function mensagemDeErro(codigo) {
      switch (codigo) {
        case "auth/expired-action-code":
          return "Esse link expirou. Peça um novo link de redefinição no app.";
        case "auth/invalid-action-code":
          return "Esse link já foi usado ou não é mais válido. Peça um novo link de redefinição no app.";
        case "auth/user-disabled":
          return "Essa conta está desativada. Fale com o suporte do Bolão Bolado.";
        case "auth/user-not-found":
          return "Não encontramos essa conta. Peça um novo link de redefinição no app.";
        case "auth/weak-password":
        case "auth/password-does-not-meet-requirements":
          return "Senha fraca demais. Use pelo menos 8 caracteres, com letras e números.";
        default:
          return "Não deu pra concluir a redefinição. Peça um novo link de redefinição no app.";
      }
    }

    const parametros = new URLSearchParams(window.location.search);
    const modo = parametros.get("mode");
    const codigo = parametros.get("oobCode");

    async function iniciar() {
      if (modo !== "resetPassword" || !codigo) {
        elMensagemErroGeral.textContent =
          "Esse link está incompleto. Peça um novo link de redefinição no app.";
        mostrarApenas(elErroGeral);
        return;
      }

      try {
        const email = await verifyPasswordResetCode(auth, codigo);
        elEmailUsuario.textContent = email;
        mostrarApenas(elFormularioBloco);
      } catch (erro) {
        elMensagemErroGeral.textContent = mensagemDeErro(erro.code);
        mostrarApenas(elErroGeral);
      }
    }

    elForm.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      elErroFormulario.style.display = "none";

      const senha = elSenha.value;
      const confirmarSenha = elConfirmarSenha.value;

      // Mesma regra do cadastro no app (problemaDaSenha em auth_service.dart)
      // e da política de senha do Firebase: sem ela, a redefinição era a
      // porta dos fundos para voltar a usar uma senha de 6 dígitos.
      if (senha.length < 8) {
        elErroFormulario.textContent = "A senha precisa ter pelo menos 8 caracteres.";
        elErroFormulario.style.display = "block";
        return;
      }
      if (!/[A-Za-z]/.test(senha) || !/\d/.test(senha)) {
        elErroFormulario.textContent = "A senha precisa ter letras e números.";
        elErroFormulario.style.display = "block";
        return;
      }
      if (senha !== confirmarSenha) {
        elErroFormulario.textContent = "As senhas não são iguais.";
        elErroFormulario.style.display = "block";
        return;
      }

      elBotaoSalvar.disabled = true;
      elBotaoSalvar.textContent = "Salvando…";

      try {
        await confirmPasswordReset(auth, codigo, senha);
        mostrarApenas(elSucesso);
      } catch (erro) {
        elMensagemErroGeral.textContent = mensagemDeErro(erro.code);
        mostrarApenas(elErroGeral);
      }
    });

    iniciar();
  </script>
</body>
</html>
